services:
  suivi-maj-gt2:
    build: .
    image: sifa/suivi-maj-gt2:1.0.0
    container_name: suivi-maj-gt2
    restart: unless-stopped
    ports:
      # N'exposer que sur la boucle locale si un reverse proxy (nginx, Traefik)
      # assure la terminaison HTTPS : remplacer par "127.0.0.1:8080:8080".
      - "8080:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      DATA_DIR: /app/server/data
    volumes:
      # Les données de l'équipe vivent ici, hors du conteneur : elles
      # survivent aux mises à jour de l'image.
      - ./data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
